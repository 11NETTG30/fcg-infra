services:

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

  postgres-users:
    image: postgres:18.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fcg_users
    volumes:
      - postgres-users-data:/var/lib/postgresql

  fcg-users:
    build:
      context: ../../fcg-users
      dockerfile: Dockerfile
      secrets:
        - nuget_token
    ports:
      - "5083:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres-users;Port=5432;Database=fcg_users;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__ChavePrivadaRsaBase64: ${JWT_PRIVATE_KEY_BASE64}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Documentacao__Habilitada: "true"
    depends_on:
      - postgres-users
      - rabbitmq

  postgres-catalog:
    image: postgres:18.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fcg_catalogo
    volumes:
      - postgres-catalog-data:/var/lib/postgresql

  fcg-catalog:
    build:
      context: ../../fcg-catalog
      dockerfile: Dockerfile
      secrets:
        - nuget_token
    ports:
      - "5084:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres-catalog;Port=5432;Database=fcg_catalogo;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Jwt__Authority: http://fcg-users:8080
      Jwt__Audiencia: fcg-services
      Documentacao__Habilitada: "true"
    depends_on:
      - postgres-catalog
      - rabbitmq
      - fcg-users

  postgres-payments:
    image: postgres:18.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fcg_payments
    volumes:
      - postgres-payments-data:/var/lib/postgresql

  fcg-payments:
    build:
      context: ../../fcg-payments/src
      dockerfile: API/Dockerfile
      secrets:
        - nuget_token
    ports:
      - "5085:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres-payments;Port=5432;Database=fcg_payments;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      - postgres-payments
      - rabbitmq

  fcg-notifications:
    build:
      context: ../../fcg-notifications/src
      dockerfile: FCG.Notifications.API/Dockerfile
      secrets:
        - nuget_token
    environment:
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__User: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
    depends_on:
      - rabbitmq

secrets:
  nuget_token:
    environment: NUGET_AUTH_TOKEN

volumes:
  postgres-users-data:
  postgres-catalog-data:
  postgres-payments-data:
