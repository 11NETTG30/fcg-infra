apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-api
  template:
    metadata:
      labels:
        app: users-api
    spec:
      containers:
      - name: users-api
        image: ghcr.io/11nettg30/fcg-users-api:latest
        ports:
          - containerPort: 8080
        envFrom:
          - secretRef:
              name: users-secret
          - configMapRef:
              name: users-config
