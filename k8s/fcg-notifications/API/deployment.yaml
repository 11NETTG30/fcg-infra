apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-api
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-api
  template:
    metadata:
      labels:
        app: notifications-api
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z rabbitmq 5672; do
                echo "Aguardando RabbitMQ..."
                sleep 3
              done
              echo "RabbitMQ OK!"

      containers:
      - name: notifications-api
        image: ghcr.io/11nettg30/fcg-notifications-api:latest
        ports:
          - containerPort: 8080
        envFrom:
          - secretRef:
              name: notifications-secret
          - configMapRef:
              name: notifications-config
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "300m"