apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-catalog
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-catalog
  template:
    metadata:
      labels:
        app: postgres-catalog
    spec:
      containers:
      - name: postgres
        image: postgres:18.1
        ports:
          - containerPort: 5432
        envFrom:
          - secretRef:
              name: postgres-catalog-secret
        volumeMounts:
          - mountPath: /var/lib/postgresql
            name: postgres-storage
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-catalog-pvc
