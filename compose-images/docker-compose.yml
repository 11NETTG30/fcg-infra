services:

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-users:
    image: postgres:18.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fcg_users
    volumes:
      - postgres-users-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d fcg_users"]
      interval: 10s
      timeout: 5s
      retries: 5

  fcg-users:
    image: ghcr.io/11nettg30/fcg-users-api:latest
    ports:
      - "5083:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres-users;Port=5432;Database=fcg_users;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__ChavePrivadaRsaBase64: ${JWT_PRIVATE_KEY_BASE64}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Documentacao__Habilitada: "true"
    depends_on:
      postgres-users:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres-catalog:
    image: postgres:18.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fcg_catalogo
    volumes:
      - postgres-catalog-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d fcg_catalogo"]
      interval: 10s
      timeout: 5s
      retries: 5

  fcg-catalog:
    image: ghcr.io/11nettg30/fcg-catalog-api:latest
    ports:
      - "5084:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres-catalog;Port=5432;Database=fcg_catalogo;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Jwt__Authority: http://fcg-users:8080
      Jwt__Audiencia: fcg-services
      Documentacao__Habilitada: "true"
    depends_on:
      postgres-catalog:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      fcg-users:
        condition: service_started

  postgres-payments:
    image: postgres:18.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fcg_payments
    volumes:
      - postgres-payments-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d fcg_payments"]
      interval: 10s
      timeout: 5s
      retries: 5

  fcg-payments:
    image: ghcr.io/11nettg30/fcg-payments-api:latest
    ports:
      - "5085:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres-payments;Port=5432;Database=fcg_payments;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Pagamento__TaxaReprovacao: "0.30"
    depends_on:
      postgres-payments:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "8025:8025"
      - "1025:1025"

  fcg-notifications:
    image: ghcr.io/11nettg30/fcg-notifications-api:latest
    environment:
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__User: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Smtp__Host: mailpit
      Smtp__Porta: "1025"
      Smtp__Remetente: noreply@fcg.com
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres-users-data:
  postgres-catalog-data:
  postgres-payments-data:
