services:

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: rabbitmq-diagnostics check_port_connectivity
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-users:
    image: postgres:18.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fcg_users
    volumes:
      - postgres-users-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d fcg_users"]
      interval: 10s
      timeout: 5s
      retries: 5

  fcg-users:
    build:
      context: ../../fcg-users
      dockerfile: Dockerfile
      secrets:
        - nuget_token
    ports:
      - "5083:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres-users;Port=5432;Database=fcg_users;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__ChavePrivadaRsaBase64: ${JWT_PRIVATE_KEY_BASE64}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Documentacao__Habilitada: "true"
    depends_on:
      postgres-users:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongoDb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-catalog:
    image: postgres:18.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fcg_catalogo
    volumes:
      - postgres-catalog-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d fcg_catalogo"]
      interval: 10s
      timeout: 5s
      retries: 5

  fcg-catalog:
    build:
      context: ../../fcg-catalog
      dockerfile: Dockerfile
      secrets:
        - nuget_token
    ports:
      - "5084:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres-catalog;Port=5432;Database=fcg_catalogo;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      MongoDB__ConnectionString: ${MONGODB_CONNECTION_STRING}
      MongoDB__DatabaseName: ${MONGODB_DATABASE_NAME}
      Jwt__Authority: http://fcg-users:8080
      Jwt__Audiencia: fcg-services
      Documentacao__Habilitada: "true"
    depends_on:
      postgres-catalog:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      fcg-users:
        condition: service_started
      redis:
        condition: service_healthy
      mongoDb:
        condition: service_healthy

  postgres-payments:
    image: postgres:18.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fcg_payments
    volumes:
      - postgres-payments-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d fcg_payments"]
      interval: 10s
      timeout: 5s
      retries: 5

  fcg-payments:
    build:
      context: ../../fcg-payments/
      dockerfile: Dockerfile
      secrets:
        - nuget_token
    ports:
      - "5085:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=postgres-payments;Port=5432;Database=fcg_payments;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Pagamento__TaxaReprovacao: "0.30"
    depends_on:
      postgres-payments:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.24
    ports:
      - "8025:8025"
      - "1025:1025"

  fcg-notifications:
    build:
      context: ../../fcg-notifications/src
      dockerfile: FCG.Notifications.API/Dockerfile
      secrets:
        - nuget_token
    environment:
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__User: ${RABBITMQ_USER}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD}
      Smtp__Host: mailpit
      Smtp__Porta: "1025"
      Smtp__Remetente: noreply@fcg.com
    depends_on:
      rabbitmq:
        condition: service_healthy
      mailpit:
        condition: service_started

secrets:
  nuget_token:
    environment: NUGET_AUTH_TOKEN

volumes:
  postgres-users-data:
  postgres-catalog-data:
  postgres-payments-data:
