apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: fcg
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo:3200
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      jsonData:
        derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"traceId":"(\w+)"'
          name: TraceID
          url: "$${__value.raw}"
  grafana.ini: |
    [auth.anonymous]
    enabled = true
    org_role = Viewer
    [server]
    root_url = http://grafana.fcg
