apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: fcg
data:
  kong.yaml: |
    _format_version: "3.0"
    _transform: true
    services:
      - name: users-api
        url: http://users-api.fcg.svc.cluster.local:80
        connect_timeout: 10000
        read_timeout: 60000
        write_timeout: 60000
        routes:
          - name: users-auth-public
            hosts:
              - api.fcg
            paths:
              - ~/identidade/(auth/.*)
            strip_path: true
            preserve_host: false
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /api/$(uri_captures[1])

          - name: users-protected
            hosts:
              - api.fcg
            paths:
              - ~/identidade/(.*)
            strip_path: true
            preserve_host: false
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /api/$(uri_captures[1])
              - name: jwt-keycloak
                config:
                  allowed_iss:
                    - fcg-users
                  well_known_template: http://users-api.fcg.svc.cluster.local:80/.well-known/openid-configuration
                  claims_to_verify:
                    - exp
                  consumer_match: false

      - name: catalog-api
        url: http://catalog-api.fcg.svc.cluster.local:80
        connect_timeout: 10000
        read_timeout: 60000
        write_timeout: 60000
        routes:
          - name: catalog-routes
            hosts:
              - api.fcg
            paths:
              - ~/catalogo/(.*)
            strip_path: true
            preserve_host: false
            plugins:
              - name: request-transformer
                config:
                  replace:
                    uri: /api/$(uri_captures[1])
              - name: jwt-keycloak
                config:
                  allowed_iss:
                    - fcg-users
                  well_known_template: http://users-api.fcg.svc.cluster.local:80/.well-known/openid-configuration
                  claims_to_verify:
                    - exp
                  consumer_match: false

    plugins:
      - name: rate-limiting
        config:
          minute: 120
          hour: 3600
          policy: local
          fault_tolerant: true
          hide_client_headers: false

      - name: cors
        config:
          origins:
            - "*"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Accept
            - Authorization
            - Content-Type
            - X-Requested-With
          credentials: false
          max_age: 3600
          preflight_continue: false

      - name: request-size-limiting
        config:
          allowed_payload_size: 2
          size_unit: megabytes