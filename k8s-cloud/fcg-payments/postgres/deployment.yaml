apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-payment
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-payment
  template:
    metadata:
      labels:
        app: postgres-payment
    spec:
      containers:
      - name: postgres
        image: postgres:18.1
        ports:
          - containerPort: 5432
        envFrom:
          - secretRef:
              name: postgres-payment-secret
        volumeMounts:
          - mountPath: /var/lib/postgresql
            name: postgres-storage
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "100m"
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-payment-pvc