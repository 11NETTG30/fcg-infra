apiVersion: v1
kind: Secret
metadata:
  name: users-secret
  namespace: fcg
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: Host=postgres-users;Port=5432;Database=fcg_users;Username=<DB_USER>;Password=<DB_PASSWORD>
  # Chave privada RSA 2048 (PKCS#8, DER) em base64. Para gerar uma nova:
  #   Linux / macOS / WSL / Git Bash: openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -outform DER 2>/dev/null | base64 -w 0; echo
  Jwt__ChavePrivadaRsaBase64: <JWT_PRIVATE_KEY_BASE64>
  RabbitMQ__Username: <RABBITMQ_USER>
  RabbitMQ__Password: <RABBITMQ_PASSWORD>
