apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-api
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-api
  template:
    metadata:
      labels:
        app: notifications-api
    spec:
      containers:
      - name: notifications-api
        image: ghcr.io/11nettg30/fcg-notifications-api:latest
        ports:
          - containerPort: 8080
        envFrom:
          - secretRef:
              name: notifications-secret
          - configMapRef:
              name: notifications-config
